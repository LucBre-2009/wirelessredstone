name: Generate custom block textures

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/generate_textures.py"
      - ".github/workflows/generate-textures.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: python tools/generate_textures.py
      - name: Commit generated PNG textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/wirelessredstone/textures/block/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Add custom WirelessRedstone pixel textures"
            git pull --rebase origin main
            git push
          fi
